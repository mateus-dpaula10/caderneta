<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Caderneta — finanças pessoais</title>
  <meta name="description" content="Controle seus ganhos e gastos e aprenda finanças pessoais com lições curtas. Funciona offline, os dados ficam no seu aparelho; conta para sincronizar é opcional.">
  <meta name="theme-color" content="#5b2a86" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#140f1c" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Caderneta">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica o tema salvo antes da primeira pintura (evita "piscar" claro/escuro).
    try {
      var t = localStorage.getItem('caderneta:theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <div class="shell" id="shell" hidden>
    <nav class="nav" aria-label="Seções do app">
      <a class="brand" href="#/inicio" aria-label="Caderneta, início">
        <img src="icons/icon.svg" alt="" width="32" height="32">
        <span>Caderneta</span>
      </a>
      <ul class="nav-list" id="nav-list"></ul>
    </nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="onboarding-root"></div>

  <button class="fab" id="fab" type="button" hidden aria-label="Novo lançamento"></button>

  <dialog id="tx-dialog" class="sheet" aria-labelledby="tx-dialog-title"></dialog>
  <dialog id="generic-dialog" class="sheet" aria-labelledby="generic-dialog-title"></dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;font-family:system-ui">A Caderneta precisa de JavaScript ativado para funcionar.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
